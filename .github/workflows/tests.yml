name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - name: Check the tap's syntax and style
        run: brew test-bot --only-tap-syntax

      # test-bot handles bottling mechanics and audits, but it can mark a failed
      # formula install as "ignored" and still exit 0 - a green run proved nothing
      # the day the wk 0.1.1 install actually failed. The steps below are the
      # un-ignorable gate: plain brew commands that print verbosely and fail the
      # job for real.
      - name: Install, test and audit the changed formulae (test-bot)
        run: brew test-bot --only-formulae

      - name: Install the formula for real
        run: brew install --verbose workerkit/tap/wk

      - name: Run the formula's test block
        run: brew test --verbose workerkit/tap/wk

      - name: Audit strictly
        run: brew audit --strict workerkit/tap/wk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            ~/Library/Logs/Homebrew/
            /home/linuxbrew/.linuxbrew/Library/Logs/Homebrew/
          if-no-files-found: ignore
